[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fftf-tools"
version = "0.3.0"
description = "From Fiction to Fact (FFTF) production helpers and agent pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fftf = "fftf_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
